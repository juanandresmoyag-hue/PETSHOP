<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop</title>
    <link rel="stylesheet" href="inicio.component.css">

</head>
<body>

    <!-- NAV BAR -->
    <header class="navbar">
        <div class="nav-icons">
            <i class="fas fa-search"></i>
            <i class="far fa-user-circle"></i>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-content">
            <h1>Hogar temporal,<br>para un gran futuro</h1>
            <p>Adopta, cuida, cambia una vida</p>
            <a href="#" class="btn-hero">Conoce más</a>
        </div>
    </section>

    <!-- CARDS SECTION -->
    <main class="cards-container">
        
        <div class="card">
            <div class="card-icon blue-icon">
                <i class="fas fa-paw"></i>
            </div>
            <h2>Mascotas</h2>
            <p>Ver y registrar</p>
        </div>

        <div class="card">
            <div class="card-icon green-icon">
                <i class="fas fa-user"></i>
            </div>
            <h2>Clientes</h2>
            <p>Gestionar propietarios</p>
        </div>

        <div class="card">
            <div class="card-icon red-icon">
                <i class="fas fa-heart"></i>
            </div>
            <h2>Adopciones</h2>
            <p>Dar una oportunidad</p>
        </div>

        <div class="card">
            <div class="card-icon purple-icon">
                <i class="fas fa-chart-bar"></i>
            </div>
            <h2>Dashboard</h2>
            <p>Ver estadísticas</p>
        </div>

    </main>

</body>
</html>
