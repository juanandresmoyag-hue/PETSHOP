<div class="registro-container">
<link rel="stylesheet" href="mascotas.component.css">

  <div class="form-section">
    <h2>Registro de Mascotas</h2>
    
    <form>
      <!-- Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre<span class="required">*</span></label>
        <input type="text" id="nombre" class="form-input" placeholder="Ej. Luna">
      </div>

      <!-- Especie -->
      <div class="form-group">
        <label for="especie">Especie<span class="required">*</span></label>
        <select id="especie" class="form-select">
          <option value="" disabled selected>Selecciona especie</option>
          <option value="canino">Canino</option>
          <option value="felino">Felino</option>
        </select>
      </div>

      <!-- Raza -->
      <div class="form-group">
        <label for="raza">Raza<span class="required">*</span></label>
        <input type="text" id="raza" class="form-input" placeholder="Ej. Golden Retriever">
      </div>

      <!-- Fila Inline para Edad y Sexo -->
      <div class="row-inline">
        <!-- Edad -->
        <div class="form-group col-edad">
          <label for="edad">Edad<span class="required">*</span></label>
          <div class="input-edad-container">
            <input type="number" id="edad" class="form-input" placeholder="Ej. 2">
            <span class="suffix">años</span>
          </div>
        </div>
        
        <!-- Sexo -->
        <div class="form-group col-sexo">
          <label>Sexo<span class="required">*</span></label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="sexo" value="macho"> Macho
            </label>
            <label class="radio-label">
              <input type="radio" name="sexo" value="hembra"> Hembra
            </label>
          </div>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="actions-group">
        <button type="submit" class="btn btn-registrar">Registrar</button>
        <button type="reset" class="btn btn-limpiar">Limpiar</button>
      </div>
    </form>
  </div>

  <!-- TARJETA INFORMATIVA VISUAL (LADO DERECHO) -->
  <aside class="info-aside">
    <div class="avatar-box">
      <!-- Asegúrate de tener una imagen válida en tus assets -->
      <img src="assets/img/perrito.png" alt="Cachorro Golden Retriever">
    </div>
    <div class="info-icon">
      <i class="fas fa-paw"></i>
    </div>
    <p>Tu mascota<br>merece un gran hogar</p>
  </aside>

</div>
